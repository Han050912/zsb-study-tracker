name: Release Desktop

# 打 tag（v*）或手动触发：构建 Windows 安装包并发布到 GitHub Releases（electron-updater 依赖 latest.yml）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 防止 tag 与 package.json 版本错位导致 latest.yml 版本混乱
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix worker

      # 桌面版没有可用的 Turnstile 回退界面，缺少凭据时必须在生成安装包前失败。
      - name: Verify desktop authentication configuration
        run: |
          if [ -z "$DESKTOP_TOKEN" ]; then
            echo "::error::DESKTOP_TOKEN 未配置，桌面登录不可用"
            exit 1
          fi
        env:
          DESKTOP_TOKEN: ${{ secrets.DESKTOP_TOKEN }}

      # mac 不进 CI：无签名 + 无更新通道
      # electron-builder 不执行 vite build，渲染层需显式先构建
      # DESKTOP_TOKEN 在构建期写入 dist/api-base.json，供主进程读取，
      # 必须挂在 build:desktop 步骤；electron-builder 不读取该变量
      - name: Build renderer
        run: |
          cp .env.example .env
          npm run build:desktop
        env:
          # 上一步已验证存在；不在日志中输出令牌值。
          DESKTOP_TOKEN: ${{ secrets.DESKTOP_TOKEN }}

      # 桌面端运行时（electron/main.cjs）依赖该产物读取 API 地址：缺失或为空直接中断发版
      # runner 为 ubuntu-latest，默认 shell 为 bash，test -s 即可覆盖「不存在 / 空文件」
      - name: Verify api-base.json artifact
        run: |
          if [ ! -s dist/api-base.json ]; then
            echo "::error::dist/api-base.json 缺失或为空，emit-api-base 插件未产出"
            exit 1
          fi

      # 注意：electron-builder 默认发布为 draft Release，需在 GitHub Releases 手动 publish 后 electron-updater 才可见
      - name: Build & publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
