name: Release Desktop

# 打 tag（v*）或手动触发：构建 Windows 安装包并发布到 GitHub Releases（electron-updater 依赖 latest.yml）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 防止 tag 与 package.json 版本错位导致 latest.yml 版本混乱
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # mac 不进 CI：无签名 + 无更新通道（见 docs/superpowers/specs/2026-09-13-cleanup-batch-design.md）
      # electron-builder 不执行 vite build，渲染层需显式先构建
      # DESKTOP_TOKEN 在渲染层构建期被消费（vite.config.ts 编译为 __DESKTOP_TOKEN__），
      # 必须挂在 build:desktop 步骤；electron-builder 不读取该变量
      - name: Build renderer
        run: npm run build:desktop
        env:
          # 桌面端共享令牌：未配置 secret 时桌面端回退人机验证（fail-closed，不阻塞发版）
          DESKTOP_TOKEN: ${{ secrets.DESKTOP_TOKEN }}

      - name: Build & publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
