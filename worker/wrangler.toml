name = "zsb-study-api"
main = "src/index.ts"
compatibility_date = "2026-08-04"
account_id = "f56530b741377e91f44791c2aecd5855"

# 与 Cloudflare Dashboard 远程配置保持一致，避免 deploy 覆盖时丢失
workers_dev = false
preview_urls = false

# 自定义域名路由：与 Cloudflare Dashboard 远程配置保持一致，避免 deploy 覆盖时丢失
routes = [
  { pattern = "cn.zsbservice.de5.net/*", zone_name = "zsbservice.de5.net" }
]

# Smart Placement：与远程 Dashboard 设置一致（靠近数据源执行）
[placement]
mode = "smart"

[observability]
enabled = true
# 注：redact_query_string（远程 Dashboard 配置，默认 false）不被当前 wrangler 4.118 识别，
# 且默认值即 false，故不在此声明；升级 wrangler 后如需可补充

[[d1_databases]]
binding = "DB"
database_name = "zsb-study-db"
database_id = "627fbd6f-d81b-48d2-9603-ef5ae333c2a3"

# 社区帖子图片存储（P0 图片上传）。首次部署前需创建一次：npx wrangler r2 bucket create zsb-study-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "zsb-study-images"

[vars]
# 非敏感配置（JWT_SECRET 通过 Cloudflare 控制台设置加密变量，不写入此文件）
# GITHUB_TOKEN 也需通过 Cloudflare Dashboard > Workers > Settings > Secrets 配置
# 用于 /api/latest-release 携带 PAT 请求 GitHub API，绕过匿名限流

# ---------- 内容安全 AI 复审（双层校验第二层）----------
# CF_API_TOKEN：Workers AI 调用令牌，属敏感密钥，禁止写入本文件或前端。
#   生产：npx wrangler secret put CF_API_TOKEN
#   本地：在 worker/.dev.vars 中写 CF_API_TOKEN=xxx（该文件已被 .gitignore 忽略）
# ENCRYPT_SECRET：敏感字段加密密钥，npx wrangler secret put ENCRYPT_SECRET（未配置回退 JWT_SECRET 派生）
#   ⚠️ 配置后再移除，或回滚到引入 ENCRYPT_SECRET 之前的代码，都会使期间写入的密文不可解（用户需重填墨墨 Token）
# CF_ACCOUNT_ID：账户 ID 非敏感，直接复用本文件顶部的 account_id。
#   若需本地覆盖（例如本地调试），可在 .dev.vars 中写 CF_ACCOUNT_ID=xxx。
#   注意：wrangler.toml 的 account_id 不会自动注入运行时 env，需在 .dev.vars 显式提供。
CF_ACCOUNT_ID = "f56530b741377e91f44791c2aecd5855"

# 每周一 08:00（UTC+8）＝ UTC 周一 00:00：双向推送上周学习周报
[triggers]
crons = ["0 0 * * 1"]

# ---------- 速率限制（Workers 内置 Rate Limiting binding，2025-09 GA）----------
# 按限值档位划分绑定；period 仅支持 10/60 秒，计数按 key 分 colo（跨实例共享，非全局精确）。
# namespace_id 账号内唯一；档位与代码 rateLimit.ts 的 RateLimitTier 一一对应。
[[ratelimits]]
name = "RL_3"
namespace_id = "1001"
[ratelimits.simple]
limit = 3
period = 60

[[ratelimits]]
name = "RL_5"
namespace_id = "1002"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "RL_10"
namespace_id = "1003"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "RL_20"
namespace_id = "1004"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RL_30"
namespace_id = "1005"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "RL_60"
namespace_id = "1006"
[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_100"
namespace_id = "1007"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "RL_120"
namespace_id = "1008"
[ratelimits.simple]
limit = 120
period = 60
